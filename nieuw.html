const ZONES = [["var(--groen)", "Chicken Champions League"], ["var(--kip)", "Play-off Chicken Champions League"], ["var(--rood)", "Degradatie"]];

// ---- Hulpfuncties ----
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const MAANDEN = { jan:0, januari:0, feb:1, februari:1, mrt:2, maart:2, apr:3, april:3, mei:4, jun:5, juni:5,
  jul:6, juli:6, aug:7, augustus:7, sep:8, sept:8, september:8, okt:9, oktober:9, nov:10, november:10, dec:11, december:11 };
function parseDatum(t) {
  if (!t) return null;
  t = String(t).trim();
  let m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], m[2] - 1, +m[3]);
  m = t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if (m) return new Date(+m[3], m[2] - 1, +m[1]);
  m = t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2})(?!\d)/);
  if (m) return new Date(2000 + +m[3], m[2] - 1, +m[1]);
  m = t.toLowerCase().match(/(\d{1,2})\s+([a-z]+)\.?\s+(\d{4})/);
  if (m && MAANDEN[m[2]] !== undefined) return new Date(+m[3], MAANDEN[m[2]], +m[1]);
  return null;
}
function parseCSV(t, sep) {
  t = t.replace(/^﻿/, "");
  const rows = []; let r = [], c = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { r.push(c); c = ""; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ""; rows.push(r); r = []; }
    else c += ch;
  }
  if (c !== "" || r.length) { r.push(c); rows.push(r); }
  return rows.filter(x => x.some(v => v.trim() !== ""));
}
const KOLOM = {
  weeknummer: ["#", "weeknummer", "week", "nr", "nummer"],
  datum: ["datum", "date", "dag"],
  locatie: ["locatie", "kok", "koks", "wie kookt", "location"],
  aanwezigen: ["aanwezigen", "aanwezig", "gasten"],
  activiteit: ["activiteit", "activiteiten"],
  opmerkingen: ["opmerkingen", "opmerking", "notities", "notitie"]
};
function maakObjecten(rows) {
  let hi = -1, map = {};
  for (let i = 0; i < Math.min(rows.length, 8); i++) {
    const m = {};
    rows[i].forEach((cel, j) => {
      const n = String(cel).replace(/ /g, " ").trim().toLowerCase();
      for (const k in KOLOM) if (m[k] === undefined && KOLOM[k].includes(n)) m[k] = j;
    });
    if (m.datum !== undefined && m.locatie !== undefined) { hi = i; map = m; break; }
  }
  if (hi < 0) throw new Error("kolommen 'Datum' en 'Locatie' niet gevonden");
  return rows.slice(hi + 1).map(r => { const o = {}; for (const k in map) o[k] = r[map[k]] || ""; return o; });
}
function norm(o) {
  const d = parseDatum(o.datum); if (!d) return null;
  const loc = (o.locatie || "").trim();
  const act = (o.activiteit || "").trim();
  const l = loc.toLowerCase();
  const aw = (o.aanwezigen || "").trim();
  return {
    wk: (o.weeknummer || "").trim(), d, loc,
    aanw: /^(\*|iedereen|allen|allemaal)$/i.test(aw) ? PERSONEN.slice() : aw.split(/[,;\n]+/).map(s => s.trim()).filter(Boolean),

    const g = el("div", "groep"); g.append(el("div", "gk", "Beheer (alleen Sjon)"));
    const sc = el("div", "schakel"); const t = el("div"); t.innerHTML = "Soundboard<small>Staat voor iedereen aan of uit</small>";
    const sw = el("button", "sw"); sw.setAttribute("aria-pressed", String(SOUND_AAN)); sw.setAttribute("aria-label", "Soundboard aan of uit"); sw.onclick = () => zetSoundboard(!SOUND_AAN, sw); sc.append(t, sw); g.append(sc);
    const s2 = el("div", "schakel"); const t2 = el("div"); t2.innerHTML = "Agenda een week opschuiven<small>De eerstvolgende avond wordt Cancel, de rest schuift op</small>"; s2.append(t2);
    const kb = el("button", null, schuifBevestig ? "Zeker weten?" : "Opschuiven");
    kb.style.cssText = "background:var(--kop);border-radius:12px;padding:10px 14px;font-weight:800;color:" + (schuifBevestig ? "var(--rood)" : "inherit");
    kb.onclick = () => { if (!schuifBevestig) { schuifBevestig = true; render(); return; } schuifBevestig = false; schuifAgenda(); };
    s2.append(kb); g.append(s2); m.append(g);
  }
  const a = el("div", "groep"); a.append(el("div", "gk", "Account"));
  const r = el("button", "rijkaart"); r.append(el("div", "n", IK ? "Ingelogd als " + IK : "Niet ingelogd"), el("span", "pijl", IK ? "Uitloggen" : "Inloggen"));
  r.onclick = () => { if (IK) uitloggen(); else { scherm = "login"; render(); } }; a.append(r);
  const o = el("a", "rijkaart", null); o.href = "index.html"; o.style.textDecoration = "none"; o.style.color = "inherit";
  o.append(el("div", "n", "Terug naar de oude versie"), el("span", "pijl", "›")); a.append(o);
  m.append(a);
}
function render() {
  const m = $("#main"); const st = m.scrollTop; m.textContent = "";
  maakNav();
  if (!geladen) { maakSub(null); m.append(el("div", "voet", "Laden…")); return; }
  if (laadFout && !DATA.length) { maakSub(null); m.append(el("div", "voet", laadFout)); const b = el("button", "knop l", "Opnieuw proberen"); b.onclick = laden; m.append(b); return; }
  if (scherm === "login") { maakSub(null); viewLogin(); return; }
  if (detail) { maakSub(null); viewDetail(); m.scrollTop = 0; return; }
  if (tab === "ed") { maakSub([["komend", "Komend"], ["archief", "Archief"]], sub, k => sub = k); viewEdities(); }
  else if (tab === "menu") { maakSub(null); viewMenu(); }

}
$("#kip").onclick = e => {

};
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - laatsteLaad > 60000) laden(); });

// Automatisch vernieuwen bij een nieuwe versie (BUILD ophogen bij elke update)
const BUILD = "nieuw-2026-11-09g";
(async () => {
  try {
    const r = await fetch("nieuw.html?nocache=" + Date.now(), { cache: "no-store" });
    const mm = (await r.text()).match(/const BUILD = "([^"]+)"/);
    if (mm && mm[1] !== BUILD && sessionStorage.getItem("kip_reload_n") !== mm[1]) {
      sessionStorage.setItem("kip_reload_n", mm[1]);
      location.replace(location.pathname + "?v=" + encodeURIComponent(mm[1]));
    }
  } catch (e) {}
})();
render();
laden();
