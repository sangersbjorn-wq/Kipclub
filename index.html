function leesAct(rows) {
  rows = rows || [];
  const kop = (rows[0] || []).map(c => String(c).trim().toLowerCase());
  let cD = kop.indexOf("datum"), cT = kop.indexOf("tijd"), cA = kop.indexOf("activiteit"), cW = kop.findIndex(c => c.indexOf("aangemeld door") === 0);
  if (cD < 0 || cA < 0) { cD = 0; cT = -1; cA = 1; cW = 2; }
  return rows.map(r => {
    const m = String(cT >= 0 ? r[cT] || "" : "").match(/(\d{1,2})[:.](\d{2})/);
    return { d: parseDatum(r[cD]), tijd: m ? ("0" + m[1]).slice(-2) + ":" + m[2] : "", tekst: String(r[cA] || "").trim().replace(/^'/, ""), door: String(cW >= 0 ? r[cW] || "" : "").trim(), eigen: true };
  }).filter(a => a.d && a.tekst);
}
function komendeActiviteiten() {

// ===== Agenda berekenen =====
function agendaItems(weken) {
  const last = {}, cnt = {};
  PERS.forEach(p => { last[p] = null; cnt[p] = 0; });
  DATA.filter(r => r.d < vandaag && r.status === "koken").forEach(r => {
    if (r.loc in last) { last[r.loc] = r.d; cnt[r.loc]++; }
  });
  const dagen = new Map();
  DATA.filter(r => r.d >= vandaag).forEach(r => dagen.set(r.d.getTime(), r));
  const eind = new Date(vandaag); eind.setDate(eind.getDate() + weken * 7);
  const t = new Date(vandaag);
  while (t.getDay() !== 2) t.setDate(t.getDate() + 1);
  for (; t <= eind; t.setDate(t.getDate() + 7)) {
    if (!dagen.has(t.getTime())) dagen.set(t.getTime(), { d: new Date(t), voorstel: true });
  }
  return [...dagen.keys()].sort((a, b) => a - b).map(k => {
    const r = dagen.get(k);
    const it = { d: r.d, row: r.voorstel ? null : r, voorstel: !!r.voorstel, wie: null, laatste: null, status: r.status || "koken" };
    if (it.voorstel) {
      it.wie = PERS.slice().sort((a, b) =>
        (last[a] ? last[a].getTime() : 0) - (last[b] ? last[b].getTime() : 0) || cnt[a] - cnt[b])[0];
    } else if (r.status === "koken") {
      it.wie = r.loc;
    }
    if (it.wie) {
      it.laatste = last[it.wie] || null;
      last[it.wie] = it.d; cnt[it.wie] = (cnt[it.wie] || 0) + 1;
    }
    return it;
  });
}
function wekenGeleden(laatste, d) {
  const w = Math.round((d - laatste) / (7 * 864e5));
  return w <= 1 ? "vorige week" : `${w} weken geleden`;
}

  box.append(bars("🍳 Kookbeurten", keer, Math.max(1, ...keer.map(x => x[1])), "×"));

  const metAanw = voorbij.filter(r => r.aanw.length);
  const aanw = PERS.map(p => [p, metAanw.length ? Math.round(metAanw.filter(r => r.aanw.includes(p)).length / metAanw.length * 100) : 0]).sort((a, b) => b[1] - a[1]);
  box.append(bars("🙋 Aanwezigheid (afgelaste avonden tellen mee)", aanw, 100, "%"));

  const info = h("div", "card");
  info.append(h("div", "klein", `Berekend uit het archief (${voorbij.length} dinsdagen tot nu toe). Aanwezigheid telt ook afgelaste avonden mee (zolang er aanwezigen zijn ingevuld).`));
  box.append(info);
}

// ===== Tabs =====
function toonTab(id) {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.t === id));
  document.querySelectorAll(".tab").forEach(s => s.hidden = s.id !== id);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => toonTab(b.dataset.t));
// Opnieuw laden als je de pagina na een minuut weer opent
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - laatsteLaad > 60000) laden();
});

const KOK = ["Kok kok kok! 🐔", "Wie kookt er dinsdag? 🍳", "Kokkerokoo! 📣"];
$("#logo").onclick = e => { const l = e.currentTarget; l.classList.remove("wip"); void l.offsetWidth; l.classList.add("wip"); toast(KOK[Math.floor(Math.random() * KOK.length)]); };

// ===== Automatisch vernieuwen bij een nieuwe versie (BUILD ophogen bij elke update) =====
const BUILD = "2026-10-25b";
(async () => {
  try {
    const r = await fetch("index.html?nocache=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/const BUILD = "([^"]+)"/);
    if (m && m[1] !== BUILD && sessionStorage.getItem("kip_reload") !== m[1]) {
      sessionStorage.setItem("kip_reload", m[1]);
      location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
    }
  } catch (e) {}
})();

laden();
</script>
